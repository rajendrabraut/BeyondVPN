[project]
name = "beyond-cp"
version = "0.2.0"
description = "Beyond VPN control plane: identity, device registry, WireGuard provisioning, usage & activity logging"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "email-validator>=2.1",
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.9",
  "pyotp>=2.9",
  "cryptography>=43",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
beyond-cp = "beyond_cp.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beyond_cp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
